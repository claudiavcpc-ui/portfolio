```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VCP_ARCHIVE — Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CURSOR -->
  <div class="cursor"></div>

  <!-- EDITOR -->

  <div class="editor">

    <div class="editor-header">
      <div>
        VCP_ARCHIVE
      </div>

      <div>
        SCENE EDITOR / 001
      </div>
    </div>


    <div class="editor-toolbar">

      <label class="upload-button">
        + SUBIR FONDO
        <input
          type="file"
          id="backgroundUpload"
          accept="image/*"
          hidden
        >
      </label>

      <button id="clearBackground">
        LIMPIAR
      </button>

      <button id="toggleEditor">
        OCULTAR EDITOR
      </button>

    </div>


    <!-- ESCENA -->

    <main
      id="scene"
      class="scene"
    >

      <div
        id="emptyScene"
        class="empty-scene"
      >
        <span>NO BACKGROUND</span>
        <small>UPLOAD IMAGE TO BEGIN</small>
      </div>

      <img
        id="backgroundImage"
        class="background-image"
        alt=""
      >

    </main>

  </div>


  <!-- CURSOR LABEL -->

  <div
    id="cursorLabel"
    class="cursor-label"
  >
    MOVE
  </div>


  <script>

    /* =========================
       CURSOR
    ========================= */

    const cursor = document.querySelector(".cursor");
    const cursorLabel = document.querySelector("#cursorLabel");

    document.addEventListener("mousemove", (event) => {

      cursor.style.left = event.clientX + "px";
      cursor.style.top = event.clientY + "px";

      cursorLabel.style.left = event.clientX + "px";
      cursorLabel.style.top = event.clientY + "px";

    });


    /* =========================
       BACKGROUND
    ========================= */

    const backgroundUpload =
      document.querySelector("#backgroundUpload");

    const backgroundImage =
      document.querySelector("#backgroundImage");

    const emptyScene =
      document.querySelector("#emptyScene");

    backgroundUpload.addEventListener("change", (event) => {

      const file =
        event.target.files[0];

      if (!file) return;

      const imageURL =
        URL.createObjectURL(file);

      backgroundImage.src =
        imageURL;

      backgroundImage.classList.add("visible");

      emptyScene.classList.add("hidden");

    });


    /* =========================
       CLEAR
    ========================= */

    const clearBackground =
      document.querySelector("#clearBackground");

    clearBackground.addEventListener("click", () => {

      backgroundImage.src = "";

      backgroundImage.classList.remove("visible");

      emptyScene.classList.remove("hidden");

      backgroundUpload.value = "";

    });


    /* =========================
       EDITOR VISIBILITY
    ========================= */

    const toggleEditor =
      document.querySelector("#toggleEditor");

    const editorToolbar =
      document.querySelector(".editor-toolbar");

    toggleEditor.addEventListener("click", () => {

      editorToolbar.classList.toggle("hidden");

      if (
        editorToolbar.classList.contains("hidden")
      ) {

        toggleEditor.textContent =
          "MOSTRAR EDITOR";

      } else {

        toggleEditor.textContent =
          "OCULTAR EDITOR";

      }

    });

  </script>

</body>
</html>
```
